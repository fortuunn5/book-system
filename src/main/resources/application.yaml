spring:
  application:
    name: book-system


  datasource:
    url: jdbc:h2:mem:bookdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true

server:
  servlet:
    context-path: /api

book-system:
    due-period-weeks: 4
